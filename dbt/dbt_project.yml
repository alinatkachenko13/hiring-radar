name: hiring_radar
version: "1.0.0"
config-version: 2
profile: hiring_radar

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # История витрин начинается с этого дня наблюдения. Пробный сбор 01.09 остался
  # на диске и на складе как архив, но в модели не идёт: между ним и следующим
  # днём разрыв в 16 дней, из-за которого все его вакансии выглядят закрытыми.
  history_starts_on: "2026-09-17"

models:
  hiring_radar:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
